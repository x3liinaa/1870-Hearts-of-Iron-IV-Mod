 autonomy_austrian_personal_union: "Habsburg Personal Union"
 
#focuses

 #Austro-Prussian War
 AUS_austria_in_despair: "Austria in Despair"
 AUS_austria_in_despair_desc: "Defeat, financial troubles, and growing nationalist movements have brought the empire to a crossroads. Unless Vienna finds a way forward, the Habsburg monarchy may soon lose its grip on the crownlands."
 AUS_shadow_of_frankfurt: "The Shadow of Frankfurt"
 AUS_shadow_of_frankfurt_desc: "The failed attempt to unite Germany under a liberal constitution remains an unresolved question. Austria must decide whether it will shape the future of the German lands or surrender that role to Prussia."
 AUS_strengthen_central_power: "Strengthen Central Power"
 AUS_strengthen_central_power_desc: "The authority of the crown has weakened as the provinces increasingly pursue their own interests. A stronger central government is necessary to preserve the empire and prevent further fragmentation."
 AUS_appease_the_lands: "Appease the Lands"
 AUS_appease_the_lands_desc: "The loyalty of our crownlands cannot be taken for granted. Political concessions and administrative reforms may persuade the various peoples of the empire that their future remains tied to the Habsburg dynasty."
 AUS_status_of_confed: "State of the Confederation"
 AUS_status_of_confed_desc: "The German Confederation is struggling to survive the rivalry between Vienna and Berlin. Austria must determine what role it can still play in Germany before Prussia dictates the future of the German states."
 AUS_outmaneuver_prussia: "Outmaneuver Prussia"
 AUS_outmaneuver_prussia_desc: "Prussia's growing influence threatens to push Austria out of German affairs entirely. Through careful diplomacy and political maneuvering, Vienna must prevent its northern rival from becoming the undisputed leader of Germany."
 AUS_seek_french_support: "Seek French Support"
 AUS_seek_french_support_desc: "Napoleon III has his own ambitions in Europe, but French interests may temporarily align with ours. Cooperation with Paris could provide the diplomatic leverage needed to counter Prussian expansion."
 AUS_holstein_crisis: "Holstein Crisis"
 AUS_holstein_crisis_desc: "The administration of Schleswig and Holstein has exposed the fundamental weaknesses of the Austro-Prussian partnership. What began as a dispute over conquered territory may become the spark that sets Germany ablaze."
 AUS_prussian_front: "The Prussian Front"
 AUS_prussian_front_desc: "War with Prussia is becoming an increasingly likely prospect. Our commanders must prepare the northern armies for a campaign against an opponent whose railways, mobilization plans, and military organization give it a dangerous advantage."
 AUS_study_prussian_tech: "Study Prussian Technology"
 AUS_study_prussian_tech_desc: "Prussia has demonstrated the value of modern weapons, efficient logistics, and rapid mobilization. By examining its military innovations, we may identify the weaknesses in our own forces and learn how to overcome them."
 AUS_shell_the_prussians: "Shell the Prussians"
 AUS_shell_the_prussians_desc: "Our artillery must become a decisive instrument on the battlefield. Improved coordination between batteries and infantry will help break enemy formations and reduce the advantage enjoyed by Prussian commanders."
 AUS_italian_front: "The Italian Front"
 AUS_italian_front_desc: "Italy continues to challenge Habsburg rule in Venetia and the surrounding territories. Should war break out, our southern armies must be prepared to defend the empire against Italian ambitions."
 AUS_fortify_south_tyrol: "Fortify South Tyrol"
 AUS_fortify_south_tyrol_desc: "The Alpine passes offer natural defensive positions, but the mountains alone cannot guarantee our security. New fortifications and prepared supply routes will make an Italian advance far more difficult."
 AUS_utilize_our_navy: "Unleash the Navy"
 AUS_utilize_our_navy_desc: "The Adriatic is essential to our trade, coastal security, and influence in the Mediterranean. Our fleet must be ready to challenge enemy warships and demonstrate that Austria remains a maritime power."
 AUS_peace_of_prague: "Peace of Prague"
 AUS_peace_of_prague_desc: "The war has ended with Austria excluded from German affairs and Prussia strengthened beyond measure. The peace offers a chance to recover, but the political consequences of defeat will shape the monarchy for years to come."
 AUS_peace_of_vienna: "Peace of Vienna"
 AUS_peace_of_vienna_desc: "A settlement negotiated in Vienna could spare the empire from the harshest consequences of defeat. Preserving our remaining influence will require difficult concessions, but the survival of the monarchy must come first."
 
 #Aftermath of the Austro-Prussian War
 AUS_great_humiliation: "Great Humiliation"
 AUS_great_humiliation_desc: "The defeat of 1866 has destroyed Austria's position as the leading German power. The monarchy must now confront its military shortcomings, its political isolation, and the growing demands of its dissatisfied peoples."
 AUS_reform_the_army: "Reform the Army"
 AUS_reform_the_army_desc: "The army's failures have made reform unavoidable. Better training, modern equipment, and a more effective command structure are essential if Austria is to defend its position among the great powers."
 AUS_military_crackdowns: "Military Crackdowns"
 AUS_military_crackdowns_desc: "The government may restore order through military intervention and stricter control of the provinces. Yet every display of force risks deepening the resentment that threatens the empire from within."
 AUS_prepare_for_whats_coming: "Prepare for What's Coming"
 AUS_prepare_for_whats_coming_desc: "The defeat has revealed that the old political and military order cannot endure unchanged. Whether the next challenge comes from foreign enemies or domestic unrest, the empire must prepare for a period of profound uncertainty."
 AUS_trouble_in_hungary: "Trouble in Hungary"
 AUS_trouble_in_hungary_desc: "Hungarian leaders demand greater independence and the restoration of their historic political rights. Vienna must find a way to address these demands before negotiations give way to another confrontation between the crown and the Hungarian estates."
 AUS_slavic_revolts: "Slavic Revolts"
 AUS_slavic_revolts_desc: "Czech, Croatian, and other Slavic movements are demanding greater recognition and political representation. Ignoring their grievances may preserve the appearance of unity for a time, but it will only make the eventual crisis more difficult to contain."
 AUS_push_for_reforms: "Push for Reforms"
 AUS_push_for_reforms_desc: "The survival of the monarchy may depend on its willingness to change. Expanding political representation and granting limited autonomy could persuade the empire's peoples to defend a shared state rather than seek independence."
 AUS_setting_a_new_course: "Setting a New Course"
 AUS_setting_a_new_course_desc: "The policies of the past have failed to prevent military defeat and political unrest. Vienna must now choose a new direction, balancing the authority of the dynasty with the demands of a changing society."
 AUS_the_ausgleich: "The Ausgleich of [GetYear]"
 AUS_the_ausgleich_desc: "A new constitutional settlement could resolve the long-standing dispute between Vienna and Budapest. The arrangement would reshape the monarchy, granting Hungary greater political independence in exchange for continued cooperation with the crown."
 AUS_uneasy_compromise: "Uneasy Compromise"
 AUS_uneasy_compromise_desc: "The agreement has prevented an immediate political crisis, but its foundations remain fragile. The competing interests of the crown, Hungary, and the other nationalities may yet undermine the stability it was meant to secure."
 AUS_multiethnic_empire: "Multiethnic Empire"
 AUS_multiethnic_empire_desc: "Just one more crown will save it!"
 AUS_crown_of_hungary: "Crown of Hungary"
 AUS_crown_of_hungary_desc: "Recognizing Hungary's historic crown and constitutional position may turn a rebellious kingdom into a willing partner. The dynasty must use tradition and negotiation to preserve its authority on both sides of the monarchy."
 AUS_december_constition: "The December Constitution"
 AUS_december_constition_desc: "The new constitution will establish the legal framework for the Dual Monarchy. It guarantees the rights of the monarchy's citizens while defining the powers of the crown and the Hungarian government."
 AUS_common_minstries: "Common Ministries"
 AUS_common_minstries_desc: "The monarchy's common ministries will coordinate the administration of foreign affairs, defense, and finance. Their work will ensure that the crown and the Hungarian government can cooperate effectively while respecting each other's authority." 
 AUS_common_army: "Common Army"
 AUS_common_army_desc: "The monarchy's common army will defend the empire against foreign threats. It will be organized under a unified command structure, with officers drawn from both Austria and Hungary, and will serve as a symbol of the monarchy's shared interests."
 AUS_strength_the_reichsrat: "Strengthen the Reichsrat"
 AUS_strength_the_reichsrat_desc: "The Reichsrat must be reformed to ensure that it can effectively represent the interests of the monarchy's diverse peoples. Greater representation and improved procedures will help prevent political deadlock and maintain the legitimacy of the government."
 AUS_the_duel_monarchy: "The Dual Monarchy"
 AUS_the_duel_monarchy_desc: "The Ausgleich has created a new political structure that recognizes the distinct identities of Austria and Hungary. The monarchy must now work to ensure that this arrangement strengthens the empire rather than dividing it."

 #Aftermath of the Ausgleich
  #Balkan Theatre
 AUS_the_balkan_theatre: "The Balkan Theatre"
 AUS_the_balkan_theatre_desc: "The Balkans remain a region of strategic importance and persistent instability. Austria must determine how to protect its interests while managing the complex political and social dynamics of the region."
 AUS_congress_of_berlin: "Congress of Berlin"
 AUS_congress_of_berlin_desc: "The Congress of Berlin has redrawn the map of South-Eastern Europe. Austria must now determine how to secure its position in the Balkans while managing the consequences of the settlement."
 AUS_diplomatic_victory: "Diplomatic Victory"
 AUS_diplomatic_victory_desc: "The settlement of the Balkan question has been achieved through diplomacy rather than war. Austria must now work to consolidate its gains and ensure that the new order is respected by both allies and rivals."
 AUS_war_against_the_ottomans: "War Against the Ottomans"
 AUS_war_against_the_ottomans_desc: "The Ottoman Empire is in decline, and Austria has an opportunity to expand its influence in the Balkans. A successful campaign could secure new territories and strengthen the monarchy's position in South-Eastern Europe."
 AUS_bosnian_administration: "The Bosnian Administration"
 AUS_bosnian_administration_desc: "Military occupation alone cannot guarantee lasting control over Bosnia and Herzegovina. A permanent civil administration must establish imperial authority while addressing the region's complex religious, social, and political divisions."
 AUS_danube_adriatic_railway: "The Danube-Adriatic Railway"
 AUS_danube_adriatic_railway_desc: "A railway linking the Danube basin with the Adriatic would strengthen trade and improve access to our southern territories. It would also allow troops and supplies to move more quickly across the monarchy."
 AUS_south_slav_compromise: "A South Slav Compromise"
 AUS_south_slav_compromise_desc: "The South Slav peoples cannot be governed indefinitely through imperial decrees alone. Greater local representation and carefully negotiated concessions may secure their cooperation without sacrificing the integrity of the monarchy."
 AUS_danubian_settlement: "The Danubian Settlement"
 AUS_danubian_settlement_desc: "The future of the Balkans cannot be left to the ambitions of rival kingdoms and foreign powers. Vienna must establish a regional order that protects its interests while preventing further instability along the Danube."
 AUS_mountain_campaign: "The Mountain Campaign"
 AUS_mountain_campaign_desc: "The rugged mountains of the Balkans present serious challenges for any advancing army. Our forces must improve their mountain warfare tactics, strengthen their supply lines, and learn to operate effectively in difficult terrain."
 AUS_secure_the_sanjak: "Secure the Sanjak"
 AUS_secure_the_sanjak_desc: "The Sanjak occupies an important position between Bosnia, Serbia, and Montenegro. Securing the region would strengthen our strategic position and complicate any attempt by neighboring states to threaten our southern territories."
 AUS_adriatic_bulwark: "The Adriatic Bulwark"
 AUS_adriatic_bulwark_desc: "Control of the Adriatic coastline is essential to the security of the monarchy's southern possessions. Expanding naval facilities and improving coastal defenses will help protect our ports, shipping, and influence in the Balkans."
 AUS_balkan_bulwark: "Balkan Bulwark"
 AUS_balkan_bulwark_desc: "The Dual Monarchy must become the principal defender of its interests in South-Eastern Europe. A stronger military presence and a network of diplomatic partners will make it harder for rival powers to challenge Vienna's position."
 AUS_balkan_protectorates: "Balkan Protectorates"
 AUS_balkan_protectorates_desc: "Direct annexation is not the only path to regional dominance. By establishing protectorates over Serbia and Bulgaria, Vienna could extend its influence while allowing local governments to retain a measure of independence under imperial supervision."
 AUS_balkan_annexation: "Annex the Balkan States"
 AUS_balkan_annexation_desc: "The creation of independent Balkan states has repeatedly challenged the security of the Dual Monarchy. Bringing these territories under direct imperial administration would eliminate rival centers of power, though it would also create new challenges of governance and resistance."
  
  #European Theatre
 AUS_the_european_theatre: "The European Theatre"
 AUS_the_european_theatre_desc: "The European balance of power is shifting, and Austria must determine how to protect its interests in a rapidly changing environment. Diplomacy, alliances, and military preparedness will all be essential to maintaining the monarchy's position."
 AUS_reconcile_with_germany: "Reconcile with Germany"
 AUS_reconcile_with_germany_desc: "Though Prussia has emerged as the dominant German power, Austria must find a way to maintain influence in the region. Rebuilding relations with the German states and participating in regional affairs will be essential to preserving our interests."
 AUS_pursue_lost_italian_ambitions: "Pursue Lost Italian Ambitions"
 AUS_pursue_lost_italian_ambitions_desc: "The Italian peninsula remains a region of strategic importance. Austria must determine whether to seek a renewed presence in Italy or focus on consolidating its position elsewhere in Europe."
 AUS_brothers_alliance: "The Brothers' Alliance"
 AUS_brothers_alliance_desc: "An alliance with Prussia could provide Austria with a powerful partner in European affairs. Yet such a partnership may also require concessions and compromises that could limit the monarchy's independence."
 AUS_defeated_powers: "Defeated Powers"
 AUS_defeated_powers_desc: "The recent wars have left Austria and France in a weakened position while Prussia has emerged stronger than ever. An alliance with our old enemy France may provide a counterbalance to Prussian influence, but it will require careful diplomacy and mutual trust."
 AUS_avenge_the_bruderkrieg: "Avenge the Bruderkrieg"
 AUS_avenge_the_bruderkrieg_desc: "The defeat of 1866 has left Austria humiliated and its position in Germany diminished. A renewed conflict with Prussia with the support of our new French allies could restore the monarchy's prestige and reassert its influence in the German lands."
 AUS_austrian_dominence: "Austrian Dominance"
 AUS_austrian_dominence_desc: "Our recent decisions have left Austria in a renewed position of strength. The monarchy must now work to consolidate its influence, strengthen its alliances, and ensure that it remains a key player in European affairs."
 AUS_fragment_italy: "Fragment Italy"
 AUS_fragment_italy_desc: "Since we once again rule over the Italian provinces, we must ensure that the Italian peninsula remains divided. By supporting regional powers and encouraging local rivalries, Austria can prevent the emergence of a unified Italy that could threaten our southern borders."
 AUS_habsburg_cavalry: "Habsburg Cavalry"
 AUS_habsburg_cavalry_desc: "The cavalry has long been a symbol of the Habsburg monarchy's military tradition. By investing in the training, equipment, and organization of our mounted forces, we can ensure that they remain a decisive element on the battlefield."
 AUS_control_over_italy: "Control Over Italy"
 AUS_control_over_italy_desc: "By vassalizing the Italian states, Austria can secure its southern borders and maintain influence over the peninsula."
 AUS_ancestral_homeland: "Ancestral Homeland"
 AUS_ancestral_homeland_desc: "The Habsburgs owned provinces in Switzerland, and the monarchy must reclaim its ancestral lands to ensure that the family retains its historic influence in the region."
 AUS_reinstate_the_confederation: "Reinstate the Confederation"
 AUS_reinstate_the_confederation_desc: "The German Confederation has been dissolved, but Austria together with France and the smaller German states have beaten Prussia. Austria must now work to restore the confederation and reassert its influence in German affairs."
 AUS_tight_adminstration_of_sg: "Tight Administration of South Germany"
 AUS_tight_adminstration_of_sg_desc: "The southern German states are a vital part of the monarchy's influence in Germany. By vassalizing these states and ensuring their loyalty, Austria ensures to maintain a strong position in the region."
 AUS_expand_the_confed: "Expand the Confederation"
 AUS_expand_the_confed_desc: "The German Confederation has been restored, but Austria must work to expand its influence over the member states. By adding the Benelux countries, Austria can strenghten the confederation even further."
 AUS_restitutio_romae: "Restitutio Romae"
 AUS_restitutio_romae_desc: ""
 AUS_reclaim_rome: "Reclaim Rome"
 AUS_reclaim_rome_desc: ""
 AUS_habsburg_sea: "Habsburg Sea"
 AUS_habsburg_sea_desc: ""

 #Czechs
 AUS_the_czech_question: "The Czech Question"
 AUS_the_czech_question_desc: "The Czechs have long sought greater recognition and autonomy within the monarchy. Austria must determine how to address their demands while maintaining the integrity of the empire."
 AUS_the_fundamental_articles: "The Fundamental Articles"
 AUS_the_fundamental_articles_desc: "The Fundamental Articles of 1871 established a framework for the administration of Bohemia and Moravia. Austria must now ensure that these provisions are implemented effectively and that the Czechs are granted the rights and representation they were promised."
 AUS_bohemian_industrialization: "Bohemian Industrialization"
 AUS_bohemian_industrialization_desc: "Bohemia has the potential to become an industrial powerhouse within the monarchy. By investing in infrastructure, education, and technological development, Austria can harness the region's resources and talent to strengthen the empire's economy."
 AUS_moravian_arms_factories: "Moravian Arms Factories"
 AUS_moravian_arms_factories_desc: "The Moravian provinces have a long tradition of arms manufacturing. By supporting the development of modern arms factories, Austria can ensure that its military is well-equipped and capable of defending the monarchy's interests."

 #Army Branch
 AUS_army_reforms_begin: "Army Reforms Begin"
 AUS_army_reforms_begin_desc: "The reconstruction of the Imperial and Royal Army begins with a thorough review of its command structure, training, and equipment. These first reforms will lay the groundwork for a modern fighting force capable of defending the monarchy against future enemies."
 AUS_modernize_military_command: "Modernize Military Command"
 AUS_modernize_military_command_desc: "The army's command structure must be modernized to improve communication, coordination, and decision-making. By implementing new organizational principles and training programs, Austria can ensure that its military leaders are prepared for the challenges of contemporary warfare."
 AUS_military_studies: "Military Studies"
 AUS_military_studies_desc: "The study of military history, strategy, and tactics is essential for the development of effective commanders. By establishing military academies and research institutions, Austria can cultivate a new generation of officers capable of leading the army to victory."
 AUS_study_german_doctrine: "Study German Doctrine"
 AUS_study_german_doctrine_desc: "Since we established new military academies and research institutions, we can now study the German military doctrine to improve our own army."
 AUS_for_the_emporer: "For the Emperor"
 AUS_for_the_emporer_desc: "Every soldier must be trained to fight for the emperor and the empire. By instilling a sense of loyalty, discipline, and duty, Austria can ensure that its army remains a formidable force on the battlefield."
 AUS_apline_warefare: "Alpine Warfare"
 AUS_apline_warefare_desc: "Since many of our provinces are in the Alps, we must train our soldiers to fight in the mountains. By developing specialized tactics, equipment, and training programs, Austria can ensure that its forces are prepared for the unique challenges of alpine warfare."
 AUS_lessons_from_italian_front: "Lessons from the Italian Front"
 AUS_lessons_from_italian_front_desc: "Since we also fought against Italy, we must learn from our mistakes and improve our army. By analyzing the successes and failures of the Italian campaign, Austria can refine its military strategy and tactics for future conflicts."
 AUS_unified_military: "Unified Military"
 AUS_unified_military_desc: "The monarchy's military forces must be unified under a single command structure. By integrating the various branches of the army, navy, and air service, Austria can ensure that its armed forces operate effectively and efficiently in defense of the empire."
 AUS_restructured_army: "Restructured Army"
 AUS_restructured_army_desc: "The army has been restructured to improve its organization, training, and equipment. These reforms will enhance the monarchy's ability to defend its interests and project power in Europe and beyond."
 AUS_new_tools_of_warfare: "New Tools of Warfare"
 AUS_new_tools_of_warfare_desc: "The development of new weapons, tactics, and technologies is essential for maintaining the army's effectiveness. By investing in research and innovation, Austria can ensure that its military remains at the forefront of modern warfare."
 AUS_traditional_ways_of_warfare: "Traditional Ways of Warfare"
 AUS_traditional_ways_of_warfare_desc: "The army must not forget the lessons of the past. By preserving traditional tactics, discipline, and esprit de corps, Austria can maintain the strengths that have long defined its military heritage."

