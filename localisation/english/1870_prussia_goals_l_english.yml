  #Prussian Industrialization Branch

      #civilian industry
      PRS_industrialzation: "Prussian Industrialization"
      PRS_industrialzation_desc: "The Prussian economy has been extremely industrial and we should start utilizing our strong economy to stand out from the rest of the great powers."
      PRS_give_to_junkers: "Give Land To Junkers"
      PRS_give_to_junkers_desc: "The Junkers own a lot of land and if we are going to continue on our path of industrialization it is best we give even more land so they can handle the more rural and agricultural parts of Prussia."
      PRS_expand_rhineland_infrastructure: "Develop The Rhineland"
      PRS_expand_rhineland_infrastructure_desc: "The Rhineland is one of the most important region in all of Germany we should start developing it now so we can futher invest into when the time comes."
      PRS_continue_deving_rhineland: "Industrial Heart of Prussia"
      PRS_continue_deving_rhineland_desc: "The Rhineland is the industrial heart of Prussia we need to continue developing it so it can lift our economy up to be the strongest in the all of Germany and the German Confederation."
      PRS_invest_in_agricultural_lands: "Invest In Agricultural Prussia"
      PRS_invest_in_agricultural_lands_desc: "Agricultural is a large part of the Prussian economy, we cannot just ignore it and let it bottleneck our economy we need to invest in the average Prussian worker and the Average Prussian farmer."
      PRS_expand_silesian_steel_mines: "Expand Silesian Steel Mines"
      PRS_expand_silesian_steel_mines_desc: "Silesia has been a massive source of steel for us, we need to expand these steel mines to produce more equipment to give more people more guns."
      PRS_berlin_economic_development: "Berlin Economic Development"
      PRS_berlin_economic_development_desc: "Our capital Berlin needs to be economically strong to compete with other massive cities like Rome and Paris."
      PRS_urbanization_projects: "Mass Urbanization Projects"
      PRS_urbanization_projects_desc: "Our urbanization has gone well so far, but it is not enough we need more cities more houses and more jobs."
