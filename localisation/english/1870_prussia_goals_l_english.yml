      PRS_prussian_bank_desc: "The Preußische Staatsbank will provide the necessary financial support for Prussia's industrial expansion."  
      PRS_extra_funding_for_industry: "Extra Funding For Industrial Research"
      PRS_extra_funding_for_industry_desc: "We need to invent better ways for our workers to work. Making the working process more efficient and better will massivly boost our economy."
      PRS_expand_university_of_berlin: "Expand The University of Berlin"
      PRS_expand_university_of_berlin_desc: "The University of Berlin has been where our main scientific talents come from, if we should expand this university we will be able to uncover more and better scientists to aid in research."  
