 fpw_austria.7.t: "Kongress von Berlin"
 fpw_austria.7.d: "[AUS.GetNameDef] schlägt ein Abkommen vor, um [TUR.GetNameDef] zwischen [ENG.GetNameDef], [SOV.GetNameDef], und [AUS.GetNameDef] zu teilen. Durch dieses Abkommen würden die balkanischen Staaten unabhängig, wobei [SOV.GetNameDef] Oberherrschaft über Rumänien erlangen würde. [ENG.GetNameDef] würde Zypern erhalten, und [AUS.GetNameDef] würde Bosnien annektieren."
 fpw_austria.7.a: "Ein großartiger Plan."
 fpw_austria.7.b: "Unmöglich!"
 fpw_austria.8.t: "Die Großmächte fordern Zugeständnisse."
 fpw_austria.8.d: " Bestimmte Mächte haben sich in Berlin getroffen, um die Zukunft unseres Landes für uns zu besprechen. Sie haben beschlossen, den Balkan unter sich aufzuteilen."
 fpw_austria.8.a: "Wir können nicht das Risiko eines großen Krieges eingehen."
 fpw_austria.8.b: "Hölle nein."
